name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: diagnose imports
        working-directory: ..
        continue-on-error: true
        run: |
          python -c "
          import traceback, sys
          mods = [
            'engine.analysis.cluster',
            'engine.analysis.embed',
            'engine.analysis.filters',
            'engine.analysis.grade',
            'engine.collectors.base',
            'engine.config',
            'engine.pipeline',
            'engine.store.firestore',
          ]
          for m in mods:
            try:
              __import__(m)
              print('OK', m)
            except Exception as e:
              print('FAIL', m, ':', e)
              traceback.print_exc()
          " 2>&1
      - run: python -m engine.tests.test_core 2>&1
        working-directory: ..
      - run: python -m engine.tests.test_pipeline_sim 2>&1
        working-directory: ..

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000"
          VITE_FIREBASE_APP_ID: placeholder
