name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: run all tests with full output
        working-directory: ..
        env:
          PYTHONPATH: .
        run: |
          set +e
          echo "=== test_core ==="
          python -m engine.tests.test_core 2>&1
          TEST_CORE_EXIT=$?
          echo "test_core exit: $TEST_CORE_EXIT"

          echo "=== test_pipeline_sim ==="
          python -m engine.tests.test_pipeline_sim 2>&1
          TEST_SIM_EXIT=$?
          echo "test_pipeline_sim exit: $TEST_SIM_EXIT"

          if [ $TEST_CORE_EXIT -ne 0 ] || [ $TEST_SIM_EXIT -ne 0 ]; then
            exit 1
          fi

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000"
          VITE_FIREBASE_APP_ID: placeholder
